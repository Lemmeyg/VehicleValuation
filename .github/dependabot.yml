version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    # Guards against a brand-new (possibly compromised) release being pulled
    # in and auto-merged before the community has had a chance to flag it.
    # https://posthog.com/docs/health-checks/keeping-sdks-current
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
