version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    # Guards against a brand-new (possibly compromised) release being pulled
    # in and auto-merged before the community has had a chance to flag it.
    # https://posthog.com/docs/health-checks/keeping-sdks-current
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
    # eslint 10 (2026-09-29) broke `npm run lint` repo-wide: eslint-config-next's
    # nested eslint-plugin-react@7.37.5 (the newest version published) isn't
    # compatible with it yet. Re-allow once eslint-config-next ships a version
    # that pulls in a fixed eslint-plugin-react.
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
